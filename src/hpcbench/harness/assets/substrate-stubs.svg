<!--
  Substrate A — the echo stubs. Inlined into the landing page by `report_index.py`, so it is
  authored against that page's palette variables rather than fixed colours, and themes with it.

  Shares its 460x376 viewBox and its four row positions (8 / 96 / 204 / 312) with
  `substrate-docker.svg`, so the two read as one comparison when placed side by side. Change a
  row here and change it there.

  Marker ids are file-unique (`ar-stub`) because both files are inlined into the same document
  and would otherwise collide on `id`. Each `<text>` stays on one source line: SVG collapses
  internal whitespace, so a wrapped label is a spacing bug waiting to happen.
-->
<svg viewBox="0 0 460 376" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="An agent's Slurm calls reach shell shims on PATH, which log each call and return a canned reply. Nothing executes.">
  <defs>
    <marker id="ar-stub" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-muted)"/>
    </marker>
  </defs>

  <!-- 1 - the agent -->
  <rect x="8" y="8" width="260" height="54" rx="9" fill="var(--diagram-fill)" stroke="var(--border)"/>
  <text x="24" y="32" font-size="14.5" font-weight="600" fill="var(--text-primary)">Agent</text>
  <text x="24" y="50" font-size="12.5" fill="var(--text-secondary)">in an isolated sandbox</text>

  <path d="M 138 64 V 92" fill="none" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#ar-stub)"/>

  <!-- 2 - the shims, and the log they write on the way past -->
  <rect x="8" y="96" width="260" height="68" rx="9" fill="var(--diagram-fill)" stroke="var(--border)"/>
  <text x="24" y="120" font-size="14.5" font-weight="600" fill="var(--text-primary)">Shims on $PATH</text>
  <text x="24" y="139" font-size="12.5" fill="var(--text-secondary)">sbatch · squeue · sacct · sinfo</text>
  <text x="24" y="156" font-size="12.5" fill="var(--text-secondary)">a few hundred lines of shell</text>

  <path d="M 272 130 H 288" fill="none" stroke="var(--text-muted)" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar-stub)"/>

  <rect x="292" y="96" width="160" height="68" rx="9" fill="var(--diagram-alt)" stroke="var(--border)"/>
  <text x="308" y="120" font-size="14.5" font-weight="600" fill="var(--text-primary)">Call log</text>
  <text x="308" y="139" font-size="12.5" fill="var(--text-secondary)">every call,</text>
  <text x="308" y="156" font-size="12.5" fill="var(--text-secondary)">with a timestamp</text>

  <path d="M 138 166 V 200" fill="none" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#ar-stub)"/>

  <!-- 3 - the lie it tells back -->
  <rect x="8" y="204" width="260" height="68" rx="9" fill="var(--diagram-fill)" stroke="var(--border)"/>
  <text x="24" y="228" font-size="14.5" font-weight="600" fill="var(--text-primary)">A plausible answer</text>
  <text x="24" y="247" font-size="12.5" fill="var(--text-secondary)">job ids, a queue that drains,</text>
  <text x="24" y="264" font-size="12.5" fill="var(--text-secondary)">Slurm's own rejection wording</text>

  <path d="M 138 274 V 308" fill="none" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#ar-stub)"/>

  <!-- 4 - the defining property, spanning the full width -->
  <rect x="8" y="312" width="444" height="56" rx="9" fill="var(--diagram-alt)" stroke="var(--status-good)" stroke-width="1.5"/>
  <text x="24" y="336" font-size="14.5" font-weight="600" fill="var(--text-primary)">Nothing executes</text>
  <text x="24" y="355" font-size="12.5" fill="var(--text-secondary)">the misuse is inferred from the text of the script</text>
</svg>
