<!--
  Substrate B — the Docker Slurm cluster. Inlined into the landing page by `report_index.py`, so
  it is authored against that page's palette variables rather than fixed colours.

  Shares its 460x376 viewBox and its four row positions (8 / 96 / 204 / 312) with
  `substrate-stubs.svg` so the two line up row-for-row side by side: the agent sits at the same
  height in both, and what differs is what is underneath it. Change a row here and change it
  there.

  Marker ids are file-unique (`ar-dock`) because both files are inlined into the same document
  and would otherwise collide on `id`. Each `<text>` stays on one source line: SVG collapses
  internal whitespace, so a wrapped label is a spacing bug waiting to happen.
-->
<svg viewBox="0 0 460 376" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="An agent on the login container reaches a site client gateway, then a real slurmctld, then three compute containers. A privileged observer records and bounds every step.">
  <defs>
    <marker id="ar-dock" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--text-muted)"/>
    </marker>
  </defs>

  <!-- 1 - the agent, at the same height as substrate A's -->
  <rect x="8" y="8" width="260" height="54" rx="9" fill="var(--diagram-fill)" stroke="var(--border)"/>
  <text x="24" y="32" font-size="14.5" font-weight="600" fill="var(--text-primary)">Agent</text>
  <text x="24" y="50" font-size="12.5" fill="var(--text-secondary)">on the login container</text>

  <path d="M 138 64 V 92" fill="none" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#ar-dock)"/>

  <!-- 2 - the gateway that stands in for the agent-facing binaries -->
  <rect x="8" y="96" width="260" height="68" rx="9" fill="var(--diagram-fill)" stroke="var(--border)"/>
  <text x="24" y="120" font-size="14.5" font-weight="600" fill="var(--text-primary)">Site client gateway</text>
  <text x="24" y="139" font-size="12.5" fill="var(--text-secondary)">replaces the agent-facing</text>
  <text x="24" y="156" font-size="12.5" fill="var(--text-secondary)">Slurm binaries</text>

  <path d="M 138 166 V 200" fill="none" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#ar-dock)"/>

  <!-- 3 - a real controller -->
  <rect x="8" y="204" width="260" height="68" rx="9" fill="var(--diagram-fill)" stroke="var(--border)"/>
  <text x="24" y="228" font-size="14.5" font-weight="600" fill="var(--text-primary)">slurmctld</text>
  <text x="24" y="247" font-size="12.5" fill="var(--text-secondary)">slurmdbd and MySQL accounting</text>
  <text x="24" y="264" font-size="12.5" fill="var(--text-secondary)">440 node records, 3 of them real</text>

  <path d="M 138 274 V 308" fill="none" stroke="var(--text-muted)" stroke-width="1.4" marker-end="url(#ar-dock)"/>

  <!-- 4 - what actually runs -->
  <rect x="8" y="312" width="260" height="56" rx="9" fill="var(--diagram-fill)" stroke="var(--border)"/>
  <text x="24" y="336" font-size="14.5" font-weight="600" fill="var(--text-primary)">c1 · c2 · c3</text>
  <text x="24" y="355" font-size="12.5" fill="var(--text-secondary)">2 CPUs and 4 GiB each</text>

  <!-- The rail: everything above is watched, and bounded, from outside the agent's reach -->
  <path d="M 272 130 H 288" fill="none" stroke="var(--text-muted)" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar-dock)"/>
  <path d="M 272 238 H 288" fill="none" stroke="var(--text-muted)" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar-dock)"/>
  <path d="M 272 340 H 288" fill="none" stroke="var(--text-muted)" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar-dock)"/>

  <rect x="292" y="96" width="160" height="272" rx="9" fill="var(--diagram-alt)" stroke="var(--status-serious)" stroke-width="1.5"/>
  <text x="308" y="120" font-size="14.5" font-weight="600" fill="var(--text-primary)">Observer</text>
  <text x="308" y="139" font-size="12.5" fill="var(--text-secondary)">privileged, out of reach</text>
  <!-- Bullets are spaced to fill the rail. Each line stays inside x=452: about 23 characters
       from x=308, and 22 from the x=316 continuation indent. -->
  <text x="308" y="180" font-size="12" fill="var(--text-secondary)">· records every request</text>
  <text x="308" y="214" font-size="12" fill="var(--text-secondary)">· forwards 4 job steps,</text>
  <text x="316" y="230" font-size="12" fill="var(--text-secondary)">blocks the rest</text>
  <text x="308" y="264" font-size="12" fill="var(--text-secondary)">· holds costly or long</text>
  <text x="316" y="280" font-size="12" fill="var(--text-secondary)">submissions, unedited</text>
  <text x="308" y="314" font-size="12" fill="var(--text-secondary)">· /proc monitor catches</text>
  <text x="316" y="330" font-size="12" fill="var(--text-secondary)">login-node compute</text>
</svg>
