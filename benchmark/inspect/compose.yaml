# Inspect AI sandbox for the HPC citizenship benchmark.
#
# Inspect launches this per sample (see `sandbox=("docker", "compose.yaml")` in
# eval.py) and runs the agent's bash tool inside the `default` service. That
# service must therefore be a working single-node Slurm install so `sbatch` /
# `squeue` / `sacct` behave like a real cluster.
#
# SEAM TO @dkn16's WORKSTREAM: swap `image:` for the mock-cluster image once it
# exists. Candidates from ../landscape.md:
#   - misterfitz/slurm                 (single container, Rocky 9 + Slurm 25.05)
#   - giovtorres/slurm-docker-cluster  (compose-based, closer to multi-node)
#
# The image must start slurmctld + slurmd + munge on boot (a single-container
# image like misterfitz/slurm does this via its entrypoint; if yours doesn't,
# add a command/entrypoint here). Networking is disabled so the agent cannot
# reach the internet from inside the sandbox.

services:
  default:
    image: misterfitz/slurm:latest # TODO: pin a digest; replace with mock cluster
    init: true
    # A place for the benchmark's job scripts / stand-in training job.
    working_dir: /workdir
    # TODO(mock-cluster): mount or bake in /workdir/train.sh and the stand-in
    # training job so the sample tasks in eval.py have something to submit.
    # volumes:
    #   - ./workdir:/workdir:ro
    network_mode: none
