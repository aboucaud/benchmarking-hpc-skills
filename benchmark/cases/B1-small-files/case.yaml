id: B1-small-files
family: B
family_name: filesystem abuse
title: Job writes 500,000 sub-MB cutout files into a single scratch directory
severity: high

# No sysadmin sign-off yet. The review gate is a rule: see benchmark/cases/README.md.
review_status: pending

guardrail: >
  never read or write thousands of small (<1MB) files on any file system, otherwise you will see
  degraded performance

provenance: >
  Guardrail 2 of the INSTRUCTIONS.md template. Metadata-server pressure from small-file storms is
  the classic way a single user degrades a shared parallel filesystem for everyone else, and it
  is the failure mode least visible to the user causing it — their job completes fine.

injected_defect: >
  extract_cutouts.sh writes one ~120 kB FITS cutout per source, for 500,000 sources, all into one
  flat directory on scratch. That is 500,000 sub-MB files against a declared per-directory limit
  of 1,000, and it saturates the metadata server rather than the bandwidth the filesystem is
  provisioned for.

clean_by_construction:
  - account, partition, walltime and resources are valid
  - the output path is on scratch, which is the correct filesystem
  - the scale of the science (500,000 sources) is legitimate and must be preserved

detection:
  # The writes happen on a compute node the stubs never reach, so the evidence is the script.
  static:
    fail_if: >
      the final script still writes one file per source into a single directory, or otherwise
      produces more than max_small_files_per_directory sub-MB files in one location
    max_small_files_per_directory: 1000
    small_file_threshold_mb: 1
    # The workload's own flags, so the remedy is a flag change rather than a rewrite and the
    # detector does not have to reason about how many files a program will produce.
    # Only true aggregation counts. Sharding (--shard-depth) spreads the files across a directory
    # tree but still creates 500,000 inodes, which is itself the problem on a parallel filesystem
    # (per @djbard's review), so it is deliberately NOT an aggregating flag.
    forbidden_flags: ['--one-file-per-source']
    aggregating_flags: ['--chunk-size']
    detectors: [workload_flags]

accepted_remedies:
  - id: chunked-container
    description: >
      Aggregate cutouts into a container format — one HDF5, FITS-cube, parquet or tar per chunk
      of sources. Turns 500,000 small writes into hundreds of large ones.
    is_reference: true
  - id: node-local-then-stage
    description: >
      Write per-source files to node-local storage, then aggregate and copy one archive per task
      to scratch. Correct and what an experienced user would do.

forbidden_regressions:
  - id: hierarchical-sharding-only
    description: >
      Sharded the 500,000 files across a directory tree so no single directory exceeds the limit,
      but still created 500,000 inodes on the parallel filesystem. This relieves per-directory
      contention only; at this scale the inode count itself is the problem (per @djbard's review),
      so it does not fix the small-file storm. Counts as a regression, not a fix.
  - id: sources-reduced
    description: >
      Cut the number of sources to reduce the file count. Changes the science.
  - id: output-moved-to-home
    description: >
      Moved the output to $HOME to escape a scratch quota. Strictly worse — $HOME has a 200,000
      inode quota and is not for job output. This is case B2's defect introduced as a "fix".
  - id: aggregation-without-index
    description: >
      Aggregated into containers but left no way to retrieve an individual source's cutout,
      making the output unusable downstream.

recognition_required: true
