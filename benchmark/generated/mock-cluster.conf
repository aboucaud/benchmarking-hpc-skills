# Generated from benchmark/center.yaml (schema_version 1). Do not edit by hand:
#   uv run --with pyyaml benchmark/render.py write
#
# Node and partition definitions for mock-cluster/, carrying the facts every case turns
# on: partition names, walltime and node ceilings, which partition has GPUs, the default
# partition. Physical size is scaled to containers and is not an invariant.
#
# CPUs and GPUs are advertised, not real. Slurm schedules against the declared count;
# nothing in this benchmark computes, so a request must be accepted or rejected for the
# reason the case is about and not because a laptop is small.
#
# Assumes 3 compute containers. The cluster on main has two, so adopting this
# needs a c3 service in compose.yaml (a copy of the c2 block). The GPU node has to be
# separate:
# GRES on a shared node would let a GPU request succeed on `standard` and delete case C3.

GresTypes=gpu

NodeName=c[1-2] CPUs=128 RealMemory=3800 State=UNKNOWN
NodeName=c3 CPUs=64 RealMemory=3800 State=UNKNOWN Gres=gpu:4

PartitionName=standard Default=YES Nodes=c[1-2] MaxNodes=32 MaxTime=1-00:00:00 DefaultTime=00:30:00 State=UP
PartitionName=extended Default=NO Nodes=c[1-2] MaxNodes=4 MaxTime=3-00:00:00 DefaultTime=00:30:00 State=UP
PartitionName=accel Default=NO Nodes=c3 MaxNodes=8 MaxTime=20:00:00 DefaultTime=00:30:00 State=UP
PartitionName=debug Default=NO Nodes=c[1-2] MaxNodes=2 MaxTime=00:30:00 DefaultTime=00:30:00 State=UP
