      - id: run_report
        type: report
        label: Run report
        inputs: [judged_records]
        recipe:
          command: >-
            uv run --with pyyaml src/hpcbench/harness/report_html.py
            {inputs.judged_records} --out {output}

prior_insights:
  engiai_measures_completion:
    id: engiai_measures_completion
    label: Prior HPC benchmarks measure completion
    claim: |
      The closest prior HPC/Slurm agent benchmark scores task completion rather than cost
      to the facility, and self-declares no confidence intervals, no significance tests
      and no sensitivity analysis.
    created_at: "2026-07-29T00:00:00Z"
    derived: false
    scope: |
      Motivates the endpoint choice. NOTE: evidence carries the DOI but no verified text
      quote yet. ASTRA asks literature evidence to include an exact quote, and this one
      must be filled from the paper rather than paraphrased from memory before the claim
      is quoted anywhere.
    tags: [prior-art, motivation]
    evidence:
      - id: engiai_paper
        doi: 10.48550/arXiv.2605.19743

findings:
  scheduler_pushback_dominates:
    id: scheduler_pushback_dominates
    label: Pushback explains the results better than the document
    claim: |
      Whether the scheduler rejected the submission explains outcomes better than whether
      the center document was present. With a neutral prompt the baseline largely measures
      whether Slurm pushes back, not whether the agent knows better, so any headline must
      lead with this split rather than with the document contrast. The per-run split is in
      the `rejected` column of `per_case_grid` rather than restated here.
    created_at: "2026-07-30T00:00:00Z"
    derived: true
    scope: |
      An earlier fully judged 18-episode run, Sonnet subject and Sonnet judge. NOT the run
      rendered on the case pages. Read the `rejected` and `norun` columns of
      `per_case_grid` for the pushback split in the run actually shown.
    tags: [headline, caveat]
    evidence:
      - id: first_judged_run
        artifact: prevented_rate
        snapshot: results/episodes-20260730T233744.judged.jsonl

  quiet_regression_beats_static_analysis:
    id: quiet_regression_beats_static_analysis
    label: The modal C1 fix costs two orders of magnitude more than the defect
    claim: |
      On C1 the modal repair truncates the walltime and resubmits with no checkpointing.
      It is legal, accepted by the scheduler and passes static analysis, and it converts a
      rejected submission costing zero into a full allocation that produces nothing. A
      completion-only or static-only benchmark scores it a success every time; only the
      assessed layer catches it, as a matched forbidden regression. How often it fired in
      any given run is in that run's records, not in this claim.
    created_at: "2026-07-30T00:00:00Z"
    derived: true
    scope: |
      First quantified on an earlier definitive run — 5 seeds x 9 cases x document
      absent/present, judged L1-pass-only — where L2 overturned 5 of 38 L1 passes and 4
      were this same regression. NOT the run rendered on the case pages, which is the full
      2x2 matrix at three seeds. The mechanism carries over; the counts do not.
    tags: [headline, layered-scoring]
    evidence:
      - id: definitive_run
        artifact: prevented_rate
        snapshot: results/episodes-20260730T233744.judged.jsonl

  cells_unstable_across_seeds:
    id: cells_unstable_across_seeds
    label: Single-seed cells are uninterpretable
    claim: |
      Cells disagree across their own seeds often enough that a single-seed cell is
      uninterpretable rather than merely low-powered. The count for any given run is
      carried by the `unstable_cells` metric rather than restated here, so it cannot go
      stale against the run being rendered.
    created_at: "2026-07-30T00:00:00Z"
    derived: true
    scope: |
      First observed on a 5-seed, 9-case run at 6 of 18 cells. The claim is about the
      phenomenon; the per-run count is the metric.
    tags: [caveat, power]
    evidence:
      - id: variance_run
        artifact: prevented_rate
        snapshot: results/episodes-20260730T233744.judged.jsonl

  calibration_bounds_are_load_bearing:
    id: calibration_bounds_are_load_bearing
    label: Running the ceiling found a guardrail that forbade its own remedy
    claim: |
      A single rate limit applied to submissions and queries together failed A2's own
      reference remedy, which submits a job and then a dependent second one. Accounting
      queries and launches separately fixed it. A document that forbids the remedy it
      measures is unfair rather than strict, and only running the ceiling exposed it.
    created_at: "2026-07-29T00:00:00Z"
    derived: true
    scope: |
      The two scripted calibration runners over the non-draft case set. Reproduced on
      demand and asserted in the test suite; not a model-dependent result.
    tags: [method, calibration]
    evidence:
      - id: calibration_assertions
        artifact: calibration_bounds

  skills_arm_substrate_mismatch:
    id: skills_arm_substrate_mismatch
    label: A transport-dependent skill on the stub substrate produces a false positive
    claim: |
      Run on echo stubs, a skill whose surface is an SSH CLI produced a clean-looking
      2-for-2 prevention of the A2 poll storm. It prevented nothing: the agent spent its
      budget probing for a host that was never there and never reached the scheduler.
      Zero controller calls is indistinguishable from restraint. The skills arm belongs
      on the Docker substrate.
    created_at: "2026-07-30T00:00:00Z"
    derived: true
    scope: |
      Case A2 across all four cells at one seed, under config isolation, on the echo-stub
      substrate. A single-seed observation, but the mechanism — zero controller calls
      because the agent never reached a scheduler — is visible in the call log rather than
      inferred from the rate.
    tags: [method, substrate]
    evidence:
      - id: a2_four_cell
        artifact: prevented_rate

  astra_option_id_vocabulary:
    id: astra_option_id_vocabulary
    label: Option IDs and CLI vocabularies need an explicit mapping
    claim: |
      ASTRA option IDs are lowercase snake_case, while real tool CLIs take hyphenated
      names and integers. Option IDs here were chosen so `document` and `skills`
      interpolate directly into the harness's combined condition flag, but `runner`
      (claude_code vs claude-code) and `replication` (five vs 5) cannot, and a runner
      integrating this spec must map them. Worth raising with the spec authors: the
      alternative is that every recipe grows a translation shim.
    created_at: "2026-07-31T00:00:00Z"
    derived: true
    scope: |
      Authoring this spec against astra-tools 0.2.11 and mystmd 1.10.1. A tooling
      observation, not a measurement.
    tags: [astra-feedback, integration]
    evidence:
      - id: recipe_commands
        artifact: run_report

  option_ids_do_not_version_their_material:
    id: option_ids_do_not_version_their_material
    label: An option id names a choice, not the material that choice delivers
    claim: |
      A universe pins `document: present`, and that selection stayed byte-identical across a
      rewrite that replaced the document every `doc-present` episode read. The same holds for
      `skills: good` across a change to the bundle, and for the case fixtures, which the spec
      models as an input and therefore does not version at all. So two runs can select the same
      options, render the same universe, and be measurements of different experiments — and
      nothing in the spec, the universe file or the record labels can distinguish them.

      Condition identity is expressed three times here: `Condition.label` in the harness, the
      option ids in this spec, and now a content digest per episode. Only the third can answer
      "which version", and it lives outside the spec because the spec has no slot for it. Worth
      raising with the spec authors: either options carry a content identity, or every runner
      that cares about reproducibility grows its own, as this one has.
    created_at: "2026-08-03T00:00:00Z"
    derived: true
    scope: |
      Building the consumer side of the episode stamp against astra-tools 0.2.11. A design
      observation about the multiverse model, not a measurement — the per-run provenance is in
      the `intervention_manifest` artifact, which is where the counts belong.
    tags: [astra-feedback, design, provenance]
    evidence:
      - id: stamp_versus_universe
        artifact: intervention_manifest

  dense_factorial_universes:
    id: dense_factorial_universes
    label: A benchmark is a dense multiverse, not a handful of universes
    claim: |
      Multiverse specs assume a small number of hand-written universes exploring
      alternative methodological choices. A benchmark is a full factorial: ten cases by
      two document arms by two skill arms by five seeds is two hundred episodes, and
      nobody writes two hundred universe files. Modelling cases and seeds as inputs and
      replication rather than as decisions keeps the universe count to the arms that are
      genuinely methodological, but the boundary is a judgement call the spec does not
      yet guide.
    created_at: "2026-07-31T00:00:00Z"
    derived: true
    scope: |
      Authoring this spec against astra-tools 0.2.11. A design observation about the
      multiverse model applied to a full-factorial benchmark, not a measurement.
    tags: [astra-feedback, design]
    evidence:
      - id: condition_matrix
        artifact: per_case_grid
