[project]
name = "hpc-skills-benchmark"
version = "0.0.0"
description = "Benchmarks for HPC agent skills / standardized platform instructions"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",  # center.yaml, case.yaml, generated configs
]

[tool.uv]
# Skeleton scripts, not an installable package — don't try to build it.
package = false

# Lint rules the harness code (stubs, detectors, render) is written against; CI runs
# `ruff check benchmark`.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
