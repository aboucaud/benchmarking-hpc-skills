x-slurm-image: &slurm-image
  image: ${MOCK_SLURM_IMAGE:-mock-slurm-cluster:25-11-2-1}
  build:
    context: .
    args:
      SLURM_TAG: ${SLURM_TAG:-slurm-25-11-2-1}
      CODEX_VERSION: ${CODEX_VERSION:-0.146.0}
      BUILD_JOBS: ${BUILD_JOBS:-2}

x-slurm-healthcheck: &slurm-healthcheck
  interval: 5s
  timeout: 5s
  retries: 24
  start_period: 10s

services:
  mysql:
    image: mariadb:12
    hostname: mysql
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: slurm_acct_db
      MARIADB_USER: slurm
      MARIADB_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      <<: *slurm-healthcheck
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping --silent --host=127.0.0.1 --user=slurm --password=password",
        ]

  slurmdbd:
    <<: *slurm-image
    command: ["slurmdbd"]
    hostname: slurmdbd
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    volumes:
      - munge_config:/etc/munge
      - slurm_config:/etc/slurm
      - slurm_logs:/var/log/slurm
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      <<: *slurm-healthcheck
      test:
        [
          "CMD-SHELL",
          "ss -ltn | grep -q ':6819' && mariadb --host=mysql --user=slurm --password=password --execute='SELECT 1' >/dev/null",
        ]

  cluster-init:
    <<: *slurm-image
    command: ["register-cluster"]
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64
    environment:
      CLUSTER_NAME: scc
      ACCOUNT_NAME: proj_astro
      BENCHMARK_USER: demo_user
    volumes:
      - munge_config:/etc/munge
      - slurm_config:/etc/slurm
    depends_on:
      slurmdbd:
        condition: service_healthy
    restart: "no"

  slurmctld:
    <<: *slurm-image
    command: ["slurmctld"]
    hostname: slurmctld
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    shm_size: 512mb
    volumes:
      - munge_config:/etc/munge
      - slurm_config:/etc/slurm
      - slurm_logs:/var/log/slurm
      - controller_state:/var/lib/slurm
    depends_on:
      cluster-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *slurm-healthcheck
      start_period: 15s
      test:
        [
          "CMD-SHELL",
          "scontrol ping | grep -iq 'is up'",
        ]

  login:
    <<: *slurm-image
    command: ["login"]
    hostname: login
    cpus: 1.0
    mem_limit: 2g
    pids_limit: 256
    shm_size: 512mb
    environment:
      CODEX_MODEL: ${CODEX_MODEL:-gpt-5.6-terra}
    volumes:
      - munge_config:/etc/munge
      - slurm_config:/etc/slurm
      - slurm_data:/data
      - home_dirs:/home
      - scratch_dirs:/scratch
      - archive_dirs:/archive
      - episode_work:/episode/work
    ports:
      - "127.0.0.1:${SSH_PORT:-2223}:22"
    depends_on:
      slurmctld:
        condition: service_healthy
    healthcheck:
      <<: *slurm-healthcheck
      start_period: 15s
      test:
        [
          "CMD-SHELL",
          "scontrol ping | grep -iq 'is up' && ss -ltn | grep -q ':22 '",
        ]

  c1:
    <<: *slurm-image
    command: ["slurmd"]
    hostname: c1
    privileged: true
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 256
    shm_size: 1gb
    volumes:
      - munge_config:/etc/munge
      - slurm_config:/etc/slurm
      - slurm_logs:/var/log/slurm
      - type: volume
        source: slurm_data
        target: /data
        volume:
          nocopy: true
      - type: volume
        source: home_dirs
        target: /home
        volume:
          nocopy: true
      - type: volume
        source: scratch_dirs
        target: /scratch
        volume:
          nocopy: true
      - type: volume
        source: archive_dirs
        target: /archive
        volume:
          nocopy: true
      - type: volume
        source: episode_work
        target: /episode/work
        volume:
          nocopy: true
      - c1_state:/var/lib/slurmd
    depends_on:
      slurmctld:
        condition: service_healthy
    healthcheck:
      <<: *slurm-healthcheck
      start_period: 15s
      test:
        [
          "CMD-SHELL",
          "scontrol show node c1 | grep -Eq 'State=(IDLE|ALLOCATED|MIXED)'",
        ]

  c2:
    <<: *slurm-image
    command: ["slurmd"]
    hostname: c2
    privileged: true
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 256
    shm_size: 1gb
    volumes:
      - munge_config:/etc/munge
      - slurm_config:/etc/slurm
      - slurm_logs:/var/log/slurm
      - type: volume
        source: slurm_data
        target: /data
        volume:
          nocopy: true
      - type: volume
        source: home_dirs
        target: /home
        volume:
          nocopy: true
      - type: volume
        source: scratch_dirs
        target: /scratch
        volume:
          nocopy: true
      - type: volume
        source: archive_dirs
        target: /archive
        volume:
          nocopy: true
      - type: volume
        source: episode_work
        target: /episode/work
        volume:
          nocopy: true
      - c2_state:/var/lib/slurmd
    depends_on:
      slurmctld:
        condition: service_healthy
    healthcheck:
      <<: *slurm-healthcheck
      start_period: 15s
      test:
        [
          "CMD-SHELL",
          "scontrol show node c2 | grep -Eq 'State=(IDLE|ALLOCATED|MIXED)'",
        ]

  c3:
    <<: *slurm-image
    command: ["slurmd"]
    hostname: c3
    privileged: true
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 256
    shm_size: 1gb
    volumes:
      - munge_config:/etc/munge
      - slurm_config:/etc/slurm
      - slurm_logs:/var/log/slurm
      - type: volume
        source: slurm_data
        target: /data
        volume:
          nocopy: true
      - type: volume
        source: home_dirs
        target: /home
        volume:
          nocopy: true
      - type: volume
        source: scratch_dirs
        target: /scratch
        volume:
          nocopy: true
      - type: volume
        source: archive_dirs
        target: /archive
        volume:
          nocopy: true
      - type: volume
        source: episode_work
        target: /episode/work
        volume:
          nocopy: true
      - c3_state:/var/lib/slurmd
    depends_on:
      slurmctld:
        condition: service_healthy
    healthcheck:
      <<: *slurm-healthcheck
      start_period: 15s
      test:
        [
          "CMD-SHELL",
          "scontrol show node c3 | grep -Eq 'State=(IDLE|ALLOCATED|MIXED)'",
        ]

volumes:
  mysql_data:
  munge_config:
  slurm_config:
  slurm_logs:
  slurm_data:
  home_dirs:
  scratch_dirs:
  archive_dirs:
  episode_work:
  controller_state:
  c1_state:
  c2_state:
  c3_state:
