# cgroup v2 inside Docker compute containers.
CgroupPlugin=autodetect
IgnoreSystemd=yes
EnableControllers=yes

# Slurm advertises production-shaped CPU counts while Docker enforces the real
# two-CPU container limit. Binding tasks to non-existent advertised CPUs would
# defeat that testing-only model.
ConstrainCores=no
ConstrainRAMSpace=yes
ConstrainDevices=no
