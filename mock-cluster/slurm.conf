# Docker Slurm configuration synchronized with benchmark/center.yaml.
#
# Complete Docker configuration: static daemon plumbing followed by the
# center.yaml-derived scheduler facts.

ClusterName=scc
SlurmctldHost=slurmctld

SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge

StateSaveLocation=/var/lib/slurm
SlurmdSpoolDir=/var/lib/slurmd
SwitchType=switch/none
MpiDefault=none
SlurmctldPidFile=/var/run/slurmctld/slurmctld.pid
SlurmdPidFile=/var/run/slurmd/slurmd.pid
ProctrackType=proctrack/cgroup
ReturnToService=2
TaskPlugin=task/cgroup
SlurmdParameters=config_overrides
MailProg=/bin/true

SlurmctldTimeout=300
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
KillWait=30
Waittime=0

SchedulerType=sched/backfill
EnforcePartLimits=YES
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory

SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd-%n.log
JobCompType=jobcomp/filetxt
JobCompLoc=/var/log/slurm/jobcomp.log

JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=5
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
AccountingStorageEnforce=associations

# The A1 reference uses array index 2000; the maximum index is MaxArraySize - 1.
MaxArraySize=2001

# Snapshot of the scheduler facts in benchmark/center.yaml (schema_version 1).
#
# Node and partition definitions for mock-cluster/, carrying the facts every case turns
# on: partition names, walltime and node ceilings, which partition has GPUs, the default
# partition. Physical size is scaled to containers and is not an invariant.
#
# CPUs and GPUs are advertised, not real. Slurm schedules against the declared count;
# nothing in this benchmark computes, so a request must be accepted or rejected for the
# reason the case is about and not because a laptop is small.
#
# Assumes 3 compute containers. The GPU node has to be separate:
# GRES on a shared node would let a GPU request succeed on `standard` and delete case C3.

GresTypes=gpu

NodeName=c[1-2] CPUs=128 RealMemory=3800 State=UNKNOWN
NodeName=c3 CPUs=64 RealMemory=3800 State=UNKNOWN Gres=gpu:4

PartitionName=standard Default=YES Nodes=c[1-2] MaxNodes=32 MaxTime=1-00:00:00 DefaultTime=00:30:00 State=UP
PartitionName=extended Default=NO Nodes=c[1-2] MaxNodes=4 MaxTime=3-00:00:00 DefaultTime=00:30:00 State=UP
PartitionName=accel Default=NO Nodes=c3 MaxNodes=8 MaxTime=20:00:00 DefaultTime=00:30:00 State=UP
PartitionName=debug Default=NO Nodes=c[1-2] MaxNodes=2 MaxTime=00:30:00 DefaultTime=00:30:00 State=UP
