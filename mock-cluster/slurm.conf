ClusterName=linux
SlurmctldHost=slurmctld

SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
AuthType=auth/munge

StateSaveLocation=/var/lib/slurm
SlurmdSpoolDir=/var/lib/slurmd
SwitchType=switch/none
MpiDefault=none
SlurmctldPidFile=/var/run/slurmctld/slurmctld.pid
SlurmdPidFile=/var/run/slurmd/slurmd.pid
ProctrackType=proctrack/cgroup
ReturnToService=2
TaskPlugin=task/cgroup
MailProg=/bin/true

SlurmctldTimeout=300
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
KillWait=30
Waittime=0

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory

SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd-%n.log
JobCompType=jobcomp/filetxt
JobCompLoc=/var/log/slurm/jobcomp.log

JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=5
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStoragePort=6819
AccountingStorageEnforce=associations

NodeName=c[1-2] CPUs=2 Boards=1 SocketsPerBoard=1 CoresPerSocket=2 ThreadsPerCore=1 RealMemory=3800 State=UNKNOWN
PartitionName=short Default=NO Nodes=c[1-2] MaxNodes=1 MaxTime=00:30:00 DefaultTime=00:10:00 DefMemPerCPU=500 OverSubscribe=NO State=UP
PartitionName=regular Default=YES Nodes=c[1-2] MaxNodes=2 MaxTime=1-00:00:00 DefaultTime=01:00:00 DefMemPerCPU=500 OverSubscribe=NO State=UP
PartitionName=long Default=NO Nodes=c[1-2] MaxNodes=2 MaxTime=5-00:00:00 DefaultTime=1-00:00:00 DefMemPerCPU=500 OverSubscribe=NO State=UP
