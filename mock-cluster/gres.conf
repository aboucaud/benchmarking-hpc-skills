# Snapshot of the scheduler facts in benchmark/center.yaml (schema_version 1).
#
# GRES with no device behind it. Enough for the scheduler to accept or reject a GPU
# request, which is what cases C2 and C3 are about.

NodeName=c3 AutoDetect=off Name=gpu File=/dev/null Flags=CountOnly
NodeName=c3 AutoDetect=off Name=gpu File=/dev/zero Flags=CountOnly
NodeName=c3 AutoDetect=off Name=gpu File=/dev/full Flags=CountOnly
NodeName=c3 AutoDetect=off Name=gpu File=/dev/random Flags=CountOnly
