[project]
name = "hpc-skills-bench"
version = "0.0.1"
description = "Harness for benchmarking whether HPC skills make coding agents better cluster citizens"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6",  # center.yaml, case.yaml, generated configs
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpcbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` on the path rather than an editable install, so `pytest` works on a fresh clone with
# nothing installed. The modules are also runnable as scripts; see the bootstrap at the top of
# each entry point.
pythonpath = ["src"]
# Run this suite SERIALLY. `pytest-xdist` was tried and removed: these tests spawn a subprocess
# per shimmed Slurm call, so parallelising at the pytest level multiplies process count until
# fork fails — `BlockingIOError: [Errno 35]` on an otherwise idle machine, plus spurious
# failures in the tests that measure a rate over a wall-clock window. Subprocess-bound is the
# reason xdist HURTS here, not the reason it helps.
#
# ~6 minutes serially, almost all of it deliberate sleeping: A2 has to poll long enough to be a
# poll storm, and the scripted runners have to be allowed to finish. Interpreter startup is not
# the cost (33ms).
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Carried from the pre-move benchmark/pyproject.toml. E must stay enabled so the `# noqa: E402`
# on each entry point's post-bootstrap imports is a used directive, not dead.
select = ["E", "F", "I", "UP", "B", "SIM"]
