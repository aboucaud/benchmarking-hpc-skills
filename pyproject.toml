[project]
name = "hpc-skills-bench"
version = "0.0.1"
description = "Harness for benchmarking whether HPC skills make coding agents better cluster citizens"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6",  # center.yaml, case.yaml, generated configs
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.6",   # the suite is subprocess-bound; -n auto roughly halves it
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpcbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` on the path rather than an editable install, so `pytest` works on a fresh clone with
# nothing installed. The modules are also runnable as scripts; see the bootstrap at the top of
# each entry point.
pythonpath = ["src"]
# `-n auto` is NOT here on purpose. It needs pytest-xdist, which is an optional dev extra, and
# an addopts entry naming a plugin that may be absent makes every documented per-file command
# abort during argument parsing with "unrecognized arguments: -n" and run zero tests. Pass it
# explicitly when you want the parallel run; the suite is subprocess-bound and roughly halves.
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
