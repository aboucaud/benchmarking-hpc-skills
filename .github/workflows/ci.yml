name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Lint + tests only. No live episodes or calibration runs here: they are heavy, and the
      # floor/ceiling calibration bounds are already asserted inside test_harness.py. These are the
      # same commands CLAUDE.md documents, so CI and the docs cannot drift.
      - run: uv run --with pyyaml --with pytest pytest tests -q
      - run: uv run --with pyyaml src/hpcbench/validate_cases.py
      - run: uv run --with pyyaml src/hpcbench/render.py check
      - run: uv run --with ruff ruff check src tests
