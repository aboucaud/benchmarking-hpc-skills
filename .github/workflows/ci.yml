name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Lint + tests only. No live episodes or calibration runs here: they are heavy, and the
      # floor/ceiling calibration bounds are already asserted inside test_harness.py. These are the
      # same commands CLAUDE.md documents, so CI and the docs cannot drift.
      - run: uv run --with pyyaml --with pytest pytest tests -q
      # The Docker substrate's own contract tests, which were not run here.
      #
      # They are not about Docker being up — they assert that the mock cluster and the document
      # the agent reads describe the same machine, and they run without a container. Leaving them
      # out is how `agents/INSTRUCTIONS.md` drifted from `center.yaml` for the whole pilot while
      # CI stayed green (#29). A substrate contract that nothing runs is a comment.
      - run: uv run --with pyyaml --with pytest pytest src/mock_cluster -q
      - run: uv run --with pyyaml src/hpcbench/validate_cases.py
      - run: uv run --with pyyaml src/hpcbench/render.py check
      - run: uv run --with ruff ruff check src tests
      # The ASTRA spec is a published artifact, so it is gated like the rest. `validate`
      # catches a decision referenced out of its scope or an option a constraint names but
      # that no longer exists; `universe check` catches a universe pinning a selection the
      # spec has since removed. Both fail late and quietly otherwise — a universe with a
      # stale selection renders as a report about a run that never happened.
      - run: uv run --with astra-tools astra validate benchmark/astra.yaml
      - name: Check every universe against the spec
        run: |
          for u in benchmark/universes/*.yaml; do
            uv run --with astra-tools astra universe check "$u" -a benchmark/astra.yaml
          done
